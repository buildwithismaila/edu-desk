name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, unit & Nuxt tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.5.0
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  e2e:
    name: E2E (desktop + mobile)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: edudesk
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Playwright globalSetup creates, migrates and seeds edudesk_test from this
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/edudesk
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.5.0
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  docker:
    name: Docker image + production boot
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Production settings for the smoke test
        working-directory: deploy
        run: |
          sed -e 's/^APP_DOMAIN=.*/APP_DOMAIN=lvh.me/' \
              -e 's/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci-password/' \
              -e "s/^SESSION_PASSWORD=.*/SESSION_PASSWORD=$(openssl rand -hex 32)/" \
              .env.example > .env
          docker compose config --quiet
      - name: Build the images
        working-directory: deploy
        run: docker compose build migrate app
      - name: Boot postgres, migrations and the app; wait until healthy
        working-directory: deploy
        run: docker compose up -d --wait --wait-timeout 180 app
      - name: Health check answers ok
        working-directory: deploy
        run: |
          docker compose exec -T app node -e "fetch('http://127.0.0.1:3000/api/_health').then(async r => { console.log(r.status, await r.text()); process.exit(r.ok ? 0 : 1) })"
      - name: Backup, then restore into a drill database
        working-directory: deploy
        run: |
          sed -i 's/^BACKUP_S3_BUCKET=.*/BACKUP_S3_BUCKET=/' .env
          docker compose build backup
          docker compose run --rm backup backup.sh
          docker compose run --rm backup restore.sh latest --into-database drill
          migrations=$(docker compose exec -T postgres sh -c 'psql -U "$POSTGRES_USER" -d drill -tAc "select count(*) from drizzle.__drizzle_migrations"')
          echo "migrations restored: $migrations"
          test "$migrations" -gt 0
      - name: Logs on failure
        if: failure()
        working-directory: deploy
        run: docker compose logs --no-color
